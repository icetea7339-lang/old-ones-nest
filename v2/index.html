/* 배치: 화면 전체가 땅의 단면이다. 위에 본체의 상태 한 줄, 아래에 지을 방 네 칸과 시간. 한 화면에 다 들어오고 스크롤은 없다. */
:root {
  color-scheme: dark;
  --ink: #0d0a12; --panel: #1d1826; --panel2: #2a2236; --line: #4a3c58; --edge: #07050a;
  --text: #ece6d6; --mute: #a59cb4; --coin: #e8c030; --ok: #6fd08c; --up: #ff7d76;
  --display: "NestPix", "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --d1: 12px; --d2: 24px; --t1: 12px; --t2: 14px;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--body); font-size: var(--t2); line-height: 1.45; word-break: keep-all; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; top: 0; right: 0; left: 0; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
#bw, #bw * { touch-action: manipulation; box-sizing: border-box; }
#bw { height: 100%; display: flex; flex-direction: column; max-width: 1100px; margin: 0 auto; }
#bw-hud { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding-block: 8px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 2px solid var(--edge); box-shadow: inset 0 -2px 0 var(--line); }
.bw-name b { font-family: var(--display); font-weight: 400; font-size: var(--d2); line-height: 1.1; } .bw-name small { color: var(--mute); font-size: var(--t1); }
.bw-stats { display: flex; gap: 12px; font-size: var(--t1); color: var(--mute); white-space: nowrap; } .bw-stats b { font-family: var(--display); font-weight: 400; color: var(--text); font-size: var(--d1); } .bw-stats small { font-size: var(--t1); }
.bw-dot { display: inline-block; width: 6px; height: 6px; margin-right: 4px; vertical-align: 1px; }
.bw-bars { flex: 1 1 140px; display: flex; flex-direction: column; gap: 3px; min-width: 100px; }
.bw-bar { display: block; height: 6px; background: var(--edge); box-shadow: inset 0 0 0 1px var(--line); } .bw-bar > i { display: block; height: 100%; }
#bw-cv { flex: 1 1 0; min-height: 0; width: 100%; display: block; touch-action: none; cursor: grab; image-rendering: pixelated; }
#bw-log { flex: none; padding: 5px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px)); font-size: var(--t1); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: clip; min-height: 26px; border-top: 2px solid var(--edge); }
#bw-ctl { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding-block: 4px max(10px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bw-seg { display: inline-flex; } .bw-seg .bw-btn + .bw-btn { margin-left: -1px; }
.bw-btn { font-family: var(--display); font-size: var(--d1); line-height: 1.35; color: var(--text); background: var(--panel2); border: 1px solid var(--edge); padding: 9px 10px; min-height: 40px; min-width: 40px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line), inset 0 3px 0 rgba(255, 255, 255, .10), inset 0 -4px 0 rgba(0, 0, 0, .30); }
.bw-btn.on, .bw-btn.pri { background: var(--coin); color: var(--ink); box-shadow: inset 0 0 0 1px #fff3a0, inset 0 3px 0 #fff3a0, inset 0 -5px 0 #a87e14; }
.bw-btn:active { transform: translateY(1px); } .bw-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.bw-note { font-size: var(--t1); color: var(--mute); line-height: 1.3; }
.bw-btn.off { color: var(--mute); box-shadow: inset 0 0 0 1px var(--line); }
#bw-log.warn { color: var(--up); }
#bw-rooms { flex: 1 1 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; max-width: 640px; }
.bw-room { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; padding: 6px 7px; min-height: 58px; text-align: left; white-space: nowrap; overflow: hidden; }
.bw-room b { font-weight: 400; } .bw-room small { font-family: var(--body); font-size: var(--t1); color: var(--mute); line-height: 1.3; } .bw-room small.ok { color: var(--coin); } .bw-room small.pend { color: var(--text); }
.bw-room.dim b { opacity: .6; }
.bw-room.lock { border: 1px dashed var(--line); color: var(--mute); font-size: var(--t1); line-height: 1.35; white-space: normal; }
#bw-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.bw-kin { vertical-align: -3px; }
#bw-modal { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; background: rgba(6, 4, 10, .84); display: flex; align-items: center; justify-content: center; padding: 16px; }
.bw-sheet { background: var(--panel); border: 2px solid var(--coin); box-shadow: inset 0 0 0 2px var(--edge), 0 8px 0 rgba(0, 0, 0, .4); max-width: 520px; width: 100%; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.bw-sheet h2 { font-family: var(--display); font-weight: 400; font-size: var(--d2); margin: 0; line-height: 1.2; } .bw-sheet p { margin: 0; } .bw-mute { color: var(--mute); font-size: var(--t1); }
.bw-opts { display: flex; flex-direction: column; gap: 6px; }
.bw-opt { display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--edge); padding: 8px 12px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line), inset 0 -4px 0 rgba(0, 0, 0, .30); }
.bw-opt span { display: flex; flex-direction: column; gap: 2px; min-width: 0; } .bw-opt b { font-family: var(--display); font-weight: 400; font-size: var(--d1); } .bw-opt small { color: var(--mute); font-size: var(--t1); }
.bw-px { image-rendering: pixelated; flex: none; }
.bw-row { display: flex; justify-content: flex-end; gap: 8px; }
@media (max-width: 520px) { :root { --d2: 16px; } .bw-btn { padding: 9px 8px; } #bw-ctl { gap: 6px; } }
@media (prefers-reduced-motion: reduce) { .bw-btn:active { transform: none; } }
</style>

</div>

function introModal() { modal(`<h2>땅속 한 칸</h2><p>별에서 떨어진 한 방울이 땅속 깊이 박혔다. 몸에서 작은 것들이 돋아나 굴을 파고 먹이를 물어 온다.</p><p class="bw-mute">방을 지으면 그 방에 맞는 권속이 몸에서 돋는다. 움터에는 일움, 송곳니 굴에는 이빨움. 자리는 권속들이 알아서 잡는다. 허물을 벗을 때 고른 것이 새 방을 연다.</p><p class="bw-mute">화면을 끌어 둘러보고, 흙을 누르면 그쪽을 판다. 굴이 넉넉해지면 '밖으로'를 눌러 땅 위까지 뚫는다. 그때부터 땅 위의 무리가 내려온다.</p><div class="bw-row"><button class="bw-btn pri" data-a="close">시작</button></div>`); }

// ---------- 흐름 ----------
function start(seed) { S = B.newWorld(seed || ((Date.now() ^ (Math.random() * 1e9)) >>> 0)); for (const k in SPR) delete SPR[k]; redrawAll(); V.cx = S.hero.x * TS + 4; V.cy = S.hero.y * TS; V.paused = false; V.acc = 0; V.done = false; V.note = null; hud(); }
function loop(now) {
  const dt = Math.min(0.25, (now - (V.last || now)) / 1000); V.last = now;
  if (S && !V.paused && !S.over && !S.molt && $('bw-modal').hidden) { V.acc += dt * V.speed; let n = 0; while (V.acc >= B.DT && n++ < 40) { V.acc -= B.DT; const st0 = S.hero.stage; B.tick(S); if (S.hero.stage !== st0) { for (const k in SPR) delete SPR[k]; } if (S.molt || S.over) break; } }
  if (S) { if (S.molt && S.molt.choices && $('bw-modal').hidden) moltModal(); if (S.over && $('bw-modal').hidden) overModal(); if (S.hero.stage === 4 && !V.done && !S.over && $('bw-modal').hidden) { V.done = true; doneModal(); } draw(); if (++V.frame % 6 === 0) hud(); }
  requestAnimationFrame(loop);
}
function tileAt(clientX, clientY) { const c = $('bw-cv'), q = c.getBoundingClientRect(), vw = q.width / V.z, vh = q.height / V.z, axp = V.cx - vw / 2 + (clientX - q.left) / V.z, ayp = V.cy - vh / 2 + (clientY - q.top) / V.z; return [Math.floor(axp / TS), Math.floor(ayp / TS)]; }
function onAction(el) { const a = el.dataset.a, v = el.dataset.v;
  if (a === 'room') { const r = B.buildRoom(S, v); V.note = r.ok ? null : { s: r.msg, until: performance.now() + 2600 }; if (r.ok && V.z >= 2) { V.cx = r.at.x * TS + 4; V.cy = r.at.y * TS; } }
  if (a === 'pause') V.paused = !V.paused; if (a === 'speed') { V.speed = +v; V.paused = false; } if (a === 'zoom') V.z = Math.max(1, Math.min(5, V.z + +v)); if (a === 'home') { V.cx = S.hero.x * TS + 4; V.cy = S.hero.y * TS; }
  if (a === 'open' && !B.openUp(S)) V.note = { s: S.hero.stage < 1 ? '첫 허물을 벗어야 밖으로 뚫을 수 있다' : '굴이 ' + B.K.ready + '칸이 되어야 뚫을 수 있다 (지금 ' + S.dug + '칸)', until: performance.now() + 2600 }; if (a === 'molt') { B.applyMolt(S, v); for (const k in SPR) delete SPR[k]; closeModal(); } if (a === 'restart') { closeModal(); start(); } if (a === 'close') closeModal(); hud(); }
function boot() {
  $('bw-ctl').innerHTML = '<div id="bw-rooms" role="group" aria-label="지을 방"></div><div id="bw-tools"></div><span id="bw-note" class="bw-note"></span>';
  document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el) onAction(el); });
  const c = $('bw-cv'), pts = new Map();
  c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); V.drag = { x: e.clientX, y: e.clientY, cx: V.cx, cy: V.cy, moved: 0, t: performance.now(), pinch: pts.size > 1 ? Math.hypot(...[...pts.values()].slice(0, 2).reduce((a, p, k) => k ? [a[0] - p.x, a[1] - p.y] : [p.x, p.y], [0, 0])) : 0, z0: V.z }; });
  c.addEventListener('pointermove', e => { if (!V.drag || !pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size > 1) { const [p, q] = [...pts.values()], d = Math.hypot(p.x - q.x, p.y - q.y); if (V.drag.pinch) V.z = Math.max(1, Math.min(5, Math.round(V.drag.z0 * d / V.drag.pinch))); else { V.drag.pinch = d; V.drag.z0 = V.z; } V.drag.moved = 99; return; } const dx = e.clientX - V.drag.x, dy = e.clientY - V.drag.y; V.drag.moved = Math.max(V.drag.moved, Math.abs(dx) + Math.abs(dy)); V.cx = V.drag.cx - dx / V.z; V.cy = V.drag.cy - dy / V.z; });
  const up = e => { const d = V.drag; pts.delete(e.pointerId); if (!pts.size) V.drag = null; if (d && d.moved < 8 && performance.now() - d.t < 500 && S && !S.over) { const [tx, ty] = tileAt(e.clientX, e.clientY); if (B.mark(S, tx, ty)) hud(); } };
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', e => { pts.delete(e.pointerId); if (!pts.size) V.drag = null; });
  c.addEventListener('wheel', e => { e.preventDefault(); V.z = Math.max(1, Math.min(5, V.z + (e.deltaY < 0 ? 1 : -1))); }, { passive: false });
  document.addEventListener('keydown', e => { if (e.key === ' ') { V.paused = !V.paused; e.preventDefault(); hud(); } });
  V.z = 3;
  start(); introModal(); requestAnimationFrame(loop);
  window.__bw = { get S() { return S; }, V, B, start, draw, hud };
}
boot();
})();</script>
