<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#14172a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<title>옛 것의 둥지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 배치 원칙: 어떤 화면도 스크롤 없이 한눈에 들어온다. 긴 내용은 아래로 늘이지 않고 탭으로 나눈다.
   PC: 위에 현황판 한 줄, 왼쪽에 지도와 할 일, 오른쪽에 고른 것의 패널.
   휴대폰: 현황판 두 줄, 지도, 할 일, 아래 단추 줄. 무언가를 고르면 패널이 지도를 덮고 올라온다. */
:root {
  color-scheme: dark;
  --ink: #14172a; --panel: #212640; --panel2: #2c3256; --line: #3f4674;
  --text: #ece6d6; --mute: #a2a8c6; --coin: #e8c030;
  --up: #ff5f57; --down: #5b9bff; --ok: #6fd08c; --warn: #ffb347;
  --fire: #e8552f; --water: #3fa7e0; --gold: #e8c030; --route: var(--coin);
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --sab: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; top: 0; right: 0; left: 0; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
/* 빠르게 두 번 누르면 브라우저가 화면을 확대하는 것을 막는다 */
html, body, #game, #game *, #title, #title *, #modal, #modal *, #scene, #scene * { touch-action: manipulation; }
#game, #title { -webkit-tap-highlight-color: transparent; }
#game { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
h1, h2, h3, .h3, .tab, .btn, .grade { font-family: var(--display); font-weight: 400; letter-spacing: .01em; }
h2 { font-size: 18px; margin: 0; text-wrap: balance; }
h3, .h3 { font-size: 15px; margin: 0; }
p { margin: 0; }
.mute { color: var(--mute); } .small { font-size: 12px; }
.up { color: var(--up); } .down { color: var(--down); } .coin { color: var(--coin); } .okc { color: var(--ok); } .warnc { color: var(--warn); }
.num { font-variant-numeric: tabular-nums; }
img.px, canvas.px { image-rendering: pixelated; display: block; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
kbd { font-family: var(--body); font-size: 11px; border: 1px solid var(--line); padding: 0 5px; color: var(--mute); }
.clamp1, .clamp2, .clamp3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.clamp1 { -webkit-line-clamp: 1; } .clamp2 { -webkit-line-clamp: 2; } .clamp3 { -webkit-line-clamp: 3; }

/* 공통 부품 */
.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); padding: 7px 12px; font-size: 14px; cursor: pointer; }
.btn:hover { border-color: var(--coin); }
.btn.pri { background: var(--coin); color: var(--ink); border-color: var(--coin); }
.btn.bad { border-color: var(--up); color: var(--up); }
.btn.sm { padding: 3px 8px; font-size: 13px; }
.btn.big { font-size: 18px; padding: 9px 20px; }
.btn.on { background: var(--coin); color: var(--ink); border-color: var(--coin); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn small { font-family: var(--body); font-size: 11px; opacity: .85; }
.btn.pri kbd, .btn.on kbd { color: var(--ink); border-color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row.nw { flex-wrap: nowrap; }
.end { justify-content: flex-end; }
.grow { flex: 1 1 0; min-width: 0; }
.card { background: var(--panel); padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
.card.in { background: var(--panel2); }
.stack { display: flex; flex-direction: column; gap: 7px; }
.chip { display: inline-block; padding: 1px 7px; font-size: 12px; background: var(--panel2); border: 1px solid var(--line); color: var(--text); white-space: nowrap; }
.chip.on { background: var(--coin); color: var(--ink); border-color: var(--coin); }
.chip.good { border-color: var(--ok); color: var(--ok); } .chip.fake { border-color: var(--up); color: var(--up); }
button.chip { cursor: pointer; font-family: var(--body); padding: 4px 9px; font-size: 13px; }
.chip.todo { border-color: var(--coin); color: var(--coin); animation: blink 1s steps(2) 3; }
.bar { height: 8px; background: var(--panel2); flex: 1 1 80px; min-width: 40px; display: block; }
.bar > i { display: block; height: 100%; background: var(--ok); }
.stack > .bar { flex: 0 0 8px; width: 100%; }
.sec { font-family: var(--display); font-size: 15px; display: flex; gap: 8px; align-items: baseline; margin-top: 2px; }
.sec small { font-family: var(--body); font-size: 12px; color: var(--mute); }

/* 탭: 긴 내용을 아래로 늘이지 않고 나눈다 */
.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); flex: none; }
.tabs.wrap { flex-wrap: wrap; border-bottom: 0; gap: 4px; }
.tab { flex: 1 1 0; min-width: 0; background: transparent; color: var(--mute); border: 1px solid transparent; border-bottom: 0; padding: 6px 4px; font-size: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs.wrap .tab { flex: 0 0 auto; border: 1px solid var(--line); padding: 4px 9px; font-size: 13px; background: var(--panel2); }
.tab small { font-family: var(--body); font-size: 11px; }
.tab:hover { color: var(--text); }
.tab.on { background: var(--panel2); color: var(--coin); border-color: var(--line); }
.tabs.wrap .tab.on { background: var(--coin); color: var(--ink); border-color: var(--coin); }
.tb { display: flex; flex-direction: column; gap: 7px; min-height: 0; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: center; }

/* 타이틀 */
.screen { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#title { height: 100%; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-block: 14px; overflow: hidden; }
#tcv { flex: 0 1 auto; min-height: 0; height: min(34vh, 320px); width: auto; max-width: 100%; aspect-ratio: 320 / 150; border: 2px solid var(--line); }
#title h1 { font-size: clamp(34px, 6vw, 64px); margin: 0; color: var(--coin); text-shadow: 4px 4px 0 #7a2a1c; line-height: 1.05; text-align: center; }
#title .tag { color: var(--mute); text-align: center; }
#menu { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; width: min(100%, 420px); flex: none; }
#menu .btn { font-size: 17px; padding: 8px; }
#menu .btn.w2 { grid-column: 1 / -1; }

/* 게임 화면 */
#game { height: 100%; height: 100dvh; display: flex; flex-direction: column; max-width: 1560px; margin: 0 auto; overflow: hidden; position: relative; }
#hud { flex: none; padding-block: 8px 7px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: nowrap; gap: 6px 16px; align-items: center; white-space: nowrap; overflow: hidden; }
.hud-top, .stats { display: contents; }
.hud-turn { font-family: var(--display); font-size: 20px; }
.hud-btns { margin-left: auto; flex-wrap: nowrap; }
.pips { display: inline-flex; gap: 4px; vertical-align: middle; }
.pip { width: 13px; height: 13px; background: var(--coin); display: inline-block; }
.pip.off { background: var(--line); }
.stat { background: none; border: 0; color: inherit; font: inherit; padding: 0; cursor: help; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 18px; }
.moon { color: var(--coin); }
#toast { position: fixed; left: 30%; transform: translateX(-50%); top: calc(var(--hud-h, 56px) + 16px + env(safe-area-inset-top, 0px)); z-index: 40; max-width: min(50vw, 560px); pointer-events: none;
  background: var(--panel2); border: 1px solid var(--coin); padding: 7px 14px; text-align: center; color: var(--text); font-size: 14px; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
#toast.err { color: var(--up); border-color: var(--up); }
#toast:empty { display: none; }
#main { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(360px, 1fr); gap: 16px; padding-block: 10px; }
#left, #right { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
#stagewrap { position: relative; flex: none; }
#stage { display: block; width: 100%; height: auto; aspect-ratio: 960 / 550; max-height: calc(100dvh - 236px); background: var(--panel); border: 2px solid var(--line); cursor: pointer; }
#viewsw { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; }
#corebtn { margin-right: 8px; border-color: var(--coin); color: var(--coin); }
[data-a="view"][aria-pressed="true"] { background: var(--route); color: var(--ink); border-color: var(--route); }
#stagetip { height: 18px; overflow: hidden; flex: none; }
#tray { gap: 6px; flex: none; }
#fore { display: none; }
#recent { flex: none; }
#recent p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
#view { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; }
#foot { flex: none; display: flex; flex-direction: column; gap: 4px; }
#foot .btn { width: 100%; }
#mnav { display: none; }

/* 패널 */
.ph { display: flex; align-items: center; gap: 8px; flex: none; min-height: 34px; }
.ph h2 { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 20px; }
.ph h2 small { font-family: var(--body); font-size: 12px; }
.xbtn { flex: none; min-width: 34px; }
.units { display: flex; flex-wrap: wrap; gap: 4px; }
.unit { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--text); font: inherit; font-size: 13px; padding: 2px 8px 2px 2px; cursor: pointer; min-width: 0; }
.unit > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit:hover, .unit.on { border-color: var(--coin); }
.unit.on { background: var(--coin); color: var(--ink); } .unit.on .mute { color: var(--ink); }
.unit.rare { outline: 1px solid var(--coin); }
.unit.off img { opacity: .4; }
.unit.mini { padding: 1px; gap: 0; } .unit.mini small { padding: 0 3px; }
.units.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.units.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.opts.c1 { grid-template-columns: minmax(0, 1fr); }
.opts.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; font-family: var(--body); padding: 6px 9px; min-width: 0; }
.opt b { font-family: var(--display); font-weight: 400; font-size: 15px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt > span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; line-height: 1.35; }
.opts.c1 .opt > span { -webkit-line-clamp: 3; }
.opt.on { background: var(--panel2); border-color: var(--coin); color: var(--text); outline: 1px solid var(--coin); }
.xp { height: 4px; background: var(--panel2); } .xp > i { display: block; height: 100%; background: var(--down); }
.slime-top { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px; align-items: center; flex: none; }
.slime-top.sm { grid-template-columns: 56px minmax(0, 1fr); }
.pts { display: grid; grid-template-columns: 40px minmax(0, 1fr) 34px; gap: 3px 8px; align-items: center; }
.pts .bar { flex: none; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; align-items: baseline; }
.rooms { display: grid; grid-template-columns: minmax(0, 96px) minmax(0, 1fr); gap: 4px 8px; align-items: center; }
.rooms > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lockd { opacity: .55; }

/* 밤 */
#night { flex: 1 1 0; min-height: 0; overflow: hidden; gap: 6px; }
#nparty { max-height: 56px; overflow: hidden; flex: none; }
#nlog { display: flex; flex-direction: column; gap: 3px; min-height: 0; overflow: hidden; flex: 1 1 0; }
#nlog p { font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
#nlog p:first-child { color: var(--text); white-space: normal; }
#nlog p.mad { color: #c8a8ff; } #nlog p.hand { color: var(--coin); }
#hand { background: var(--panel2); border: 2px solid var(--coin); flex: none; }
#hand .stack { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
#hand .btn { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 창과 대사 */
#modal { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; background: rgba(8, 9, 20, .86); display: flex; align-items: center; justify-content: center; overflow: hidden;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) calc(14px + var(--sab)) max(14px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--panel); border: 2px solid var(--coin); max-width: 600px; width: 100%; max-height: 100%; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; overflow: hidden; }
.sheet.wide { max-width: 860px; }
.mhead { flex: none; display: flex; align-items: baseline; gap: 10px; }
.mhead h2 { font-size: 22px; flex: 1 1 0; min-width: 0; }
.mhead h2 small { font-family: var(--body); font-size: 12px; }
.mbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; }
.mfoot { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
.msum { flex: 1 1 0; min-width: 0; }
#night.asking #nlog, #night.asking #nparty { display: none; }
.ledger { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 1px 12px; }
.ledger .tot { border-top: 1px solid var(--line); padding-top: 3px; font-family: var(--display); }
.ledger .tot.l { grid-column: 1 / 4; }
.pick3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pcard { align-items: center; text-align: center; gap: 3px; }
.pcard.rare { outline: 2px solid var(--coin); }
.pick6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.pick5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pick6 .btn, .pick5 .btn { font-family: var(--body); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-width: 0; }
.pick6 .btn.on, .pick5 .btn.on { background: var(--panel2); color: var(--text); outline: 2px solid var(--coin); }
.pick6 .btn b, .pick5 .btn b { font-family: var(--display); font-weight: 400; font-size: 14px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.caprow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto auto; gap: 5px; align-items: center; background: var(--panel2); padding: 3px 6px 3px 3px; }
.caprow .btn { padding: 4px 7px; font-size: 13px; white-space: nowrap; }
.grade { font-size: 84px; line-height: 1; color: var(--coin); text-shadow: 5px 5px 0 #7a2a1c; text-align: center; }
.codex { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.codex .node { background: var(--panel2); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; font-size: 12px; }
.codex .node.unk img { filter: brightness(0); opacity: .5; }
#scene { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; background: rgba(8, 9, 20, .72); display: flex; align-items: flex-end; justify-content: center; cursor: pointer;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(32px + var(--sab)) max(16px, env(safe-area-inset-left, 0px)); }
#scene .box { background: var(--panel); border: 2px solid var(--coin); width: min(100%, 860px); padding: 16px 18px; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start; min-height: 150px; }
#scene .who { font-family: var(--display); font-size: 17px; color: var(--coin); }
#scene .txt { font-size: 17px; line-height: 1.6; min-height: 3.2em; }
#scene .box.narr { grid-template-columns: minmax(0, 1fr); }
@keyframes tick { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.tick { animation: tick .25s both; }
@keyframes blink { 50% { opacity: .35; } }
@keyframes pop { from { transform: scale(.5); } to { transform: scale(1); } }
.evo img, .grade { animation: pop .5s steps(5) both; }
@media (prefers-reduced-motion: reduce) { .tick, .evo img, .grade, .chip.todo { animation: none; } }

/* 기록과 명부 */
.board { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 3px 10px; align-items: baseline; }
.board > .mute { grid-column: 1 / -1; }
.board > span:nth-child(4n+2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.rrow { background: var(--panel2); padding: 4px 6px; flex-wrap: nowrap; min-width: 0; }
.frow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; align-items: baseline; }
.frow > span:nth-child(2n) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 옛 것의 눈길 */
.favor { display: inline-flex; gap: 3px; align-items: center; }
.favor i { width: 14px; height: 8px; background: var(--line); display: block; }
.favor i.bad { background: #6a2a30; } .favor i.good { background: #2f6b46; }
.favor i.now { height: 16px; background: var(--coin); outline: 2px solid var(--text); }

/* 길잡이 */
#coach, #coach2 { border: 2px solid var(--coin); background: var(--panel2); flex: none; gap: 4px; }
#coach2 { display: none; }
.tut-glow { outline: 3px solid var(--coin) !important; outline-offset: 2px; animation: blink .8s steps(2) infinite; }

/* 결말 그림과 글 */
#endcv { width: 100%; max-width: 560px; height: auto; aspect-ratio: 16 / 9; border: 2px solid var(--line); background: #05040a; flex: none; }
.endtxt { max-width: 640px; line-height: 1.6; text-wrap: pretty; }

#rotate { display: none; }
@media (hover: none) { kbd { display: none; } .btn:hover { border-color: var(--line); } .btn.pri:hover, .btn.on:hover { border-color: var(--coin); } }
@media (min-width: 761px) { .only-m { display: none !important; } }
@media (min-width: 761px) and (max-width: 1180px) { .stat .gname, .hud-turn .moontxt { display: none; } #hud { gap: 6px 12px; } }
@media (min-width: 761px) and (max-height: 640px) { #recent { display: none; } }

/* 휴대폰 세로 화면 */
@media (max-width: 760px) {
  .only-pc { display: none !important; }
  #game { padding-left: 0; padding-right: 0; }
  #hud { flex-direction: column; align-items: stretch; gap: 4px; border-bottom-width: 1px; white-space: normal;
    padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); }
  .hud-top { display: flex; align-items: center; gap: 8px; }
  .hud-turn { font-size: 17px; white-space: nowrap; }
  .hud-ap { white-space: nowrap; }
  .hud-btns { gap: 4px; }
  .hud-btns .btn { padding: 3px 8px; font-size: 12px; min-height: 30px; white-space: nowrap; }
  .stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
  .stat { display: flex; flex-direction: column; align-items: center; background: var(--panel); padding: 2px 0 3px; line-height: 1.25; cursor: pointer; min-width: 0; }
  .stat .lb { font-size: 11px; color: var(--mute); }
  .stat b { font-size: 16px; }
  .stat .gname { display: none; }
  #main { display: flex; flex-direction: column; gap: 0; padding-block: 0; }
  #left { flex: 1 1 0; gap: 5px; }
  /* 지도는 남는 높이를 다 쓴다. 아래 줄들의 높이가 고정이라 지도 크기는 변하지 않는다 */
  #stagewrap { flex: 1 1 0; min-height: 0; }
