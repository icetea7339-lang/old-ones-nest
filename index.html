/* 옛 것의 둥지 — 겉(첫 화면·창)과 둥지 싸움 화면의 모양. 옛 화면의 모양은 src/old/style.css 에 있다. */
:root {
  color-scheme: dark;
  --ink: #14172a; --panel: #212640; --panel2: #2c3256; --line: #3f4674;
  --text: #ece6d6; --mute: #a2a8c6; --coin: #e8c030;
  --up: #ff7d76; --down: #5b9bff; --ok: #6fd08c; --warn: #ffb347;
  --display: "Nest Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --body: "Nest Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --sab: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
#title, #title *, #modal, #modal * { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: #0b0a14; color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.45; word-break: keep-all; overflow-wrap: break-word; line-break: strict; }
p, li { text-wrap: pretty; }
small { font-size: 12px; }
@media (min-width: 341px) and (max-width: 760px) { small { font-size: 13px; } }
html, body, #title, #title *, #modal, #modal * { touch-action: manipulation; }
#title, #modal { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
h1, h2, h3, p { margin: 0; }
h1, h2, .btn { font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; }
h3 { font-family: var(--body); font-weight: 600; font-size: 13px; letter-spacing: -0.01em; }
.mute { color: var(--mute); }
canvas.px, .sh-ic, .sh-cv { image-rendering: pixelated; }

/* ==== 겉 (src/shell.js) ==== */
#title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(var(--sab) + 12px); overflow: hidden; }
#tcv { display: block; width: min(100%, 480px); height: auto; max-height: 38vh; object-fit: contain; border-radius: 6px; }
#title h1 { font-size: clamp(28px, 8vw, 40px); line-height: 1.15; text-align: center; }
#menu { width: min(100%, 320px); display: flex; flex-direction: column; gap: 8px; }
#nojs { max-width: 320px; color: var(--mute); font-size: 12px; text-align: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 4px 14px; font-size: 16px; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.btn.pri { background: #1f6f6a; border-color: #49c9bd; color: #fff; }
.btn small { font-weight: 400; font-size: 13px; opacity: .85; }
.btn.sm { min-height: 38px; font-size: 14px; padding: 2px 12px; }
.btn.on { border-color: var(--coin); color: var(--coin); }
.btn.warn { color: var(--up); border-color: #7a3a40; }
.sh-row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sh-row3 .btn { padding: 4px 4px; }
.sh-lnk { align-self: center; min-height: 38px; padding: 0 12px; background: none; border: 0; color: var(--mute); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
#toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 24px); transform: translateX(-50%); z-index: 70; max-width: 86vw; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; pointer-events: none; }
#modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 10px) 10px calc(var(--sab) + 10px); background: rgba(6, 5, 12, .74); }
.sh-box { width: min(100%, 520px); max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sh-head { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; flex: none; }
.sh-head h2 { flex: 1 1 auto; font-size: 18px; }
.sh-sub { color: var(--mute); font-size: 13px; }
.sh-x { width: 42px; height: 42px; flex: none; background: none; border: 0; color: var(--mute); font-size: 16px; cursor: pointer; }
.sh-tabs { display: grid; gap: 4px; padding: 0 10px 8px; flex: none; }
.sh-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 44px; padding: 2px; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; color: var(--mute); font: inherit; font-size: 13px; line-height: 1.2; cursor: pointer; }
.sh-tab.on { color: var(--text); border-color: var(--coin); }
.sh-tab small { font-size: 11px; opacity: .8; }
.sh-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 14px 12px; }
.sh-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 8px 14px 12px; flex: none; }
.sh-body .sh-btns { padding: 0; }
.sh-ask { padding: 18px 2px 0 16px; }
.sh-ask p { font-size: 16px; margin-bottom: 10px; }
.sh-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sh-grid:has(canvas[width="96"]) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sh-cell { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; min-height: 92px; padding: 4px 2px; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font: inherit; font-size: 12px; line-height: 1.2; text-align: center; cursor: pointer; }
.sh-cell:disabled { cursor: default; color: var(--mute); }
.sh-cell canvas { flex: none; }
.sh-cell .sh-ic, .sh-cell .sh-q { margin: 16px 0; }
.sh-q { display: block; width: 32px; height: 32px; border-radius: 6px; background: #3d3a66; }
.sh-dhead { display: flex; gap: 12px; align-items: center; }
.sh-dhead canvas.big { width: 96px; height: 96px; flex: none; background: var(--ink); border-radius: 8px; }
.sh-dhead > div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sh-dhead h3 { font-size: 18px; }
.sh-bigsym { width: 64px; height: 64px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--ink); border-radius: 8px; }
.sh-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; color: var(--mute); font-size: 13px; }
.sh-tags b { color: var(--text); }
.sh-stars { display: flex; gap: 4px; margin-top: 4px; }
.sh-star { min-height: 34px; min-width: 46px; padding: 0 8px; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; color: var(--mute); font: inherit; font-size: 12px; cursor: pointer; }
.sh-star.on { color: var(--coin); border-color: var(--coin); }
.sh-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.sh-st { display: flex; flex-direction: column; padding: 4px 8px; background: var(--ink); border-radius: 6px; }
.sh-st small { color: var(--mute); font-size: 12px; }
.sh-st b { font-size: 16px; font-variant-numeric: tabular-nums; }
.sh-skill { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: var(--ink); border-radius: 8px; }
.sh-skill b { color: var(--coin); }
.sh-skill p { color: var(--mute); font-size: 13px; }
.sh-tiers { display: flex; flex-direction: column; gap: 4px; }
.sh-tiers p { display: flex; gap: 8px; }
.sh-tiers b { color: var(--coin); min-width: 16px; }
.sh-mem { display: flex; flex-wrap: wrap; gap: 6px; }
.sh-memb { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 0; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.sh-memb.no { cursor: default; }
.sh-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.sh-rows { display: grid; gap: 4px; }
.sh-rows.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sh-rows p { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; padding: 6px 8px; background: var(--ink); border-radius: 6px; }
.sh-rows span { color: var(--mute); font-size: 13px; }
.sh-setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.sh-setrow input { flex: 0 1 180px; min-width: 0; height: 32px; accent-color: var(--coin); }
.sh-run { padding: 6px 10px; background: var(--ink); border-radius: 8px; }
.sh-run p { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.sh-run .w { color: var(--ok); } .sh-run .l { color: var(--up); }
.sh-run small { margin-left: auto; color: var(--mute); }
.sh-run div { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; min-height: 28px; }
.sh-ic { flex: none; vertical-align: middle; }
#rotate { display: none; }
@media (max-height: 560px) { #tcv { max-height: 26vh; } #title { gap: 8px; } #title h1 { font-size: 26px; } }
@media (orientation: landscape) and (max-height: 480px) and (hover: none) {
  #rotate { display: flex; position: fixed; inset: 0; z-index: 80; background: var(--ink); align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 24px; }
}

/* ==== LAIR-UI 끝 ==== */
/* 폰에서 끌기가 길게 누르기(글 고르기·메뉴)나 당겨 새로 고침으로 끊기지 않게 */
#lr { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* 고르는 화면(보상, 신화 단계, 조우)의 스타일. src/lairflow.js 가 쓴다. 아래쪽은 겉(src/shell.js)의 도감·도움말에 더한 것. */
#lf { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px calc(var(--sab) + 8px); background: #06050cf4; color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.45; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#lf, #lf * { box-sizing: border-box; touch-action: manipulation; }
#lf p, #lf h2 { margin: 0; }
#lf button { font-family: inherit; }
.lf-box { --tc: #8a90b8; width: min(100%, 520px); max-height: 100%; display: flex; flex-direction: column; background: #15122a; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lf-box.t1 { --tc: #7fc4c0; }
.lf-box.t2 { --tc: #b48cff; }
.lf-box.t3 { --tc: #f2b04a; }
.lf-head { display: flex; align-items: center; gap: 10px; padding: 8px 6px 6px 14px; flex: none; }
.lf-head h2 { flex: 1 1 auto; min-width: 0; font-size: 18px; line-height: 1.25; }
.lf-sub { flex: none; color: var(--mute); font-size: 13px; }
.lf-exit { flex: none; align-self: flex-start; min-height: 40px; padding: 0 10px; background: none; border: 0; color: var(--mute); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.lf-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 12px 10px; }
.lf-foot { display: flex; gap: 8px; padding: 8px 12px 12px; flex: none; }
.lf-foot .btn { flex: 1 1 0; min-width: 0; flex-wrap: wrap; row-gap: 0; line-height: 1.2; }
.lf-foot .btn:disabled { opacity: .45; cursor: default; }
.lf-guide { color: var(--mute); font-size: 13px; }
.lf-ic, .lf-pic, .lf-boss, .lf-awcv { image-rendering: pixelated; }
.lf-ic { flex: none; vertical-align: middle; }
.lf-more { display: block; color: var(--mute); font-size: 13px; line-height: 1.45; }
.lf-more .ok, .lf-more .no { display: block; }
#lf .ok { color: #9be0a8; }
#lf .no { color: #ff9c8f; }

/* 보상과 조우의 고를 것 */
.lf-list { display: flex; flex-direction: column; gap: 6px; }
.lf-opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 6px 10px 6px 6px; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-size: 14px; text-align: left; cursor: pointer; }
.lf-opt.txt { padding: 8px 12px; }
.lf-opt.on { border-color: var(--coin); background: #1d1a36; }

.lf-coin { color: var(--coin); font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }

/* 주사위: 뼈로 깎은 흰 주사위. 성공은 보랏빛 테, 실패는 어둡게 */
.lf-die { flex: none; display: inline-grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 44px; height: 44px; padding: 6px; gap: 2px; background: #e9e2cf; border: 2px solid #0c0812; border-radius: 8px; box-shadow: inset 0 -3px 0 #c9c0a6; }

.lf-stat { display: flex; flex-direction: column; align-items: center; padding: 3px 2px; background: var(--ink); border: 1px solid transparent; border-radius: 6px; line-height: 1.2; }

.lf-stat.coin b { color: var(--coin); }
.lf-text { font-size: 15px; line-height: 1.6; }
.lf-chosen { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding-top: 4px; border-top: 1px solid var(--line); }

.lf-gains { display: flex; flex-wrap: wrap; gap: 6px; }

/* 신화 단계 */
.lf-box.mythos, .lf-box.awake { border-color: var(--tc); }
.lf-box.mythos .lf-head { align-items: center; background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 22%, transparent), transparent); }
.lf-box.t3.mythos, .lf-box.t3.awake { box-shadow: 0 0 0 1px #7a2a20, 0 0 28px #f2b04a44; }

.lf-syn { display: inline-flex; align-items: center; gap: 2px; }
.lf-cards { display: grid; gap: 6px; }
.lf-card { display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 8px 10px; background: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--tc); border-radius: 8px; color: var(--text); font-size: 14px; text-align: left; cursor: pointer; }
.lf-card.on { border-color: var(--coin); border-left-color: var(--tc); background: #1d1a36; }
.lf-ch { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.lf-ch b { font-size: 16px; line-height: 1.25; }
.lf-ch small { margin-left: auto; color: var(--mute); font-size: 12px; }
.lf-pw, .lf-pr { display: flex; align-items: baseline; gap: 8px; line-height: 1.35; }

  if (page === 'mad') h = li(['침입자는 체력과 함께 정신을 가진다. 보라 줄이 정신이다.', '정신이 0이 된 침입자는 미쳐서 둥지 편에서 싸운다. 우두머리 가운데에는 미치지 않는 자가 있다.', '공포 판정: 침입자는 권속과 처음 맞붙을 때 제 의지만큼 주사위를 굴린다. 5와 6이 성공이다.'])
    + `<div class="sh-dice">${shDie(2, 'no')}${shDie(3, 'no')}<span class="t"><b>얼어붙음</b> 정신을 크게 잃고 잠깐 멎는다</span></div><div class="sh-dice">${shDie(5, 'ok')}${shDie(1, 'no')}<span class="t"><b>흔들림</b> 정신을 조금 잃는다</span></div><div class="sh-dice">${shDie(6, 'ok')}${shDie(5, 'ok')}<span class="t"><b>버팀</b> 아무 일도 없다</span></div>`
    + li(['본체와 값 5 권속의 스킬은 판정을 한 번 더 부른다.', `이긴 싸움에서 미친 채 남은 침입자는 다음 싸움에 광신도가 되어 둥지 편에 선다. ${F.zealMax}까지다.`]);
  if (page === 'myth') { const at = F.mythosAt || [], fa = F.fearAt || [];
    h = li([`라운드 ${at.join(' · ')}의 준비 앞에 신화 단계가 온다. 한 판에 ${at.length}번이다.`, '셋 가운데 하나를 받아들인다. 단계마다 한 번, 셋을 버리고 다시 볼 수 있다.', '신화마다 권능과 대가가 함께 온다.'])
      + li([`등급은 ${[1, 2, 3].map(t => `<b class="sh-tier t${t}">${esc(LAIR.TIERN[t])}</b>`).join(', ')}의 차례로 무거워진다. 공포가 높을수록 무거운 등급이 나온다.`, '받아들일 때마다 본체가 한 단계 깨어난다. 모습은 받아들인 신화에 가장 많은 성향을 따른다.', `공포는 이기면 오르고 지면 내린다. ${fa.join(' · ')}에 닿으면 바깥이 답한다.`])
      + `<div class="sh-rows">${fa.map((n, i) => `<p><b>${n}</b><span>${esc((LAIR.WORLD || [])[i] || '')}</span></p>`).join('')}</div>`; }
  if (page === 'enc') { const S = LAIR.STAT || {}, C = LAIR.CLSN, A = LAIR.ASPN, src = { menace: '세운 권속의 값과 별', whisper: [C.caller, A.dusk, A.nebula].join(' · '), hunger: [C.hunter, A.hunger, A.abyss].join(' · '), brood: [C.mother, C.guard, A.brood].join(' · ') };
    h = li(['이긴 뒤의 보상에 조우가 섞여 나온다. 굴 앞에 찾아온 것을 어떻게 할지 고른다.', '판정이 붙은 길은 둥지의 힘만큼 주사위를 굴린다. 5와 6이 성공이고, 적힌 수만큼 나와야 한다.', `모자라면 진액을 내고 실패한 주사위만 다시 굴린다. 값은 ${F.rerollBase}에서 시작해 굴릴 때마다 1 오른다.`])
      + `<div class="sh-dice">${shDie(6, 'ok')}${shDie(4, 'no')}${shDie(1, 'no')}<span class="t">성공 1</span></div>`
      + `<div class="sh-rows">${Object.keys(S).map(k => `<p><b>${esc(S[k])}</b><span>${esc(src[k] || '')}</span></p>`).join('')}</div>` + li(['둥지의 힘은 1에서 시작해 6까지다. 판 위에 세운 권속으로 센다.']); }
  shOpen('help', shHead('도움말') + shTabs(SHHELP, page, 'hpage') + `<div class="sh-body">${h}</div><div class="sh-btns"><button class="btn sm" data-a="film">여는 이야기 보기</button></div>`);
}

// ---------- 설정 ----------
function shSet() {
  const v = META.vol || {}, tog = (k, name, on) => `<p class="sh-setrow"><span>${name}</span><button class="btn sm${on ? ' on' : ''}" data-a="tog" data-v="${k}" aria-pressed="${!!on}">${on ? '켬' : '끔'}</button></p>`;
  const rng = (k, name) => `<label class="sh-setrow"><span>${name}</span><input type="range" min="0" max="100" step="5" value="${Math.round((v[k] == null ? 1 : v[k]) * 100)}" data-vol="${k}" aria-label="${name} 크기"></label>`;
  shOpen('set', shHead('설정') + `<div class="sh-body">${tog('sound', '효과음', META.sound)}${tog('music', '음악', META.music !== false)}${rng('master', '전체 소리')}${rng('music', '음악 소리')}${rng('sfx', '효과음 소리')}${tog('shake', '흔들림과 번쩍임', META.shake !== false)}${CLOUD ? tog('trace', '그만둔 곳 남기기', META.trace !== false) : ''}</div>`
    + '<div class="sh-btns"><button class="btn sm" data-a="film">여는 이야기 보기</button><button class="btn sm warn" data-a="wipe">기록 지우기</button></div>');
}

// ---------- 지난 판 ----------
// 기록의 모양은 lairui.js 의 lrRecord 가 정한다. 없는 칸은 건너뛴다 (act 막, step 깨어남 단계, mythos 받아들인 신화 id 들)
function shLast() {
  const rows = META.last.slice().reverse().map(r => { const d = new Date(+r.t || 0), team = Array.isArray(r.team) ? r.team.filter(q => Array.isArray(q) && LAIR.KIN[q[0]]).slice(0, 8) : [];
    const evo = typeof r.form === 'string' && LAIR.EVO ? LAIR.EVO[r.form] : null, step = Math.max(0, Math.min(3, +r.step || (evo ? 1 : 0))), form = evo && step ? `<span>${shSym(r.form, 16)}${esc(evo.names[step >= 3 ? 1 : 0])}</span>` : '';
    const myth = (Array.isArray(r.mythos) ? r.mythos : []).filter(id => typeof id === 'string' && LAIR.MYTHOS && LAIR.MYTHOS[id]).slice(0, 3);
    return `<div class="sh-run"><p><b class="${r.win ? 'w' : 'l'}">${r.win ? '이김' : '짐'}</b><span>${+r.round || 0}/${+r.rounds || 0}</span><span>목숨 ${+r.hp || 0}</span><span>Lv ${+r.level || 0}</span>${form}<small>${d.getMonth() + 1}.${d.getDate()}</small></p><div>${team.map(q => shKinIcon(q[0], Math.max(1, Math.min(3, +q[1] || 1)), 28)).join('')}</div>${myth.length ? `<div class="sh-myth">${myth.map(id => `<span>${shSym(LAIR.MYTHOS[id].asp, 16)}${esc(LAIR.MYTHOS[id].name)}</span>`).join('')}</div>` : ''}</div>`; }).join('');
  shOpen('last', shHead('지난 판', `<span class="sh-sub">${META.runs}판 · ${META.wins}승</span>`) + `<div class="sh-body">${rows || '<p class="mute">아직 끝낸 판이 없다.</p>'}</div>`);
}

// ---------- 누름 ----------
function shClick(e) {
  if (e.target.id === 'modal') return shClose();
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; const a = b.dataset.a, v = b.dataset.v; shSay('click');
  if (a === 'close') return shClose();
  if (a === 'cont') { const run = shSaved(); if (!run) return showTitle(); return shStart(run); }
  if (a === 'start') { const run = shSaved(); if (run) return shAsk('하던 판은 사라진다.', '새로 시작', 'fresh'); return shStart(null); }
  if (a === 'fresh') { try { store.del('lairrun'); } catch (er) { /* 저장 없이 */ } return shStart(null); }
  if (a === 'codex') { SH.pick = null; return shCodex(); }
  if (a === 'ctab') { SH.tab = v; SH.pick = null; return shCodex(); }
  if (a === 'cpick') { SH.pick = v; SH.star = 1; return shCodex(); }
  if (a === 'cgo') { SH.tab = 'kin'; SH.pick = v; SH.star = 1; return shCodex(); }
  if (a === 'cstar') { SH.star = +v; return shCodex(); }
  if (a === 'cback') { SH.pick = null; return shCodex(); }
  if (a === 'help') return shHelp();
  if (a === 'hpage') { SH.page = v; return shHelp(); }
  if (a === 'set') return shSet();
  if (a === 'last') return shLast();
  if (a === 'film') return shFilm();
  if (a === 'tog') { META[v] = !(v === 'sound' ? META.sound : META[v] !== false); saveMeta(); if (v === 'music') { try { musicSet(META.music); } catch (er) { /* 음악 없이 */ } } return shSet(); }
  if (a === 'wipe') return shAsk('기록과 하던 판을 모두 지운다.', '지운다', 'wipeok');
  if (a === 'wipeok') { wipeSaves(); saveMeta(); shVol(); return showTitle(); }
}
function shInput(e) { const k = e.target.dataset && e.target.dataset.vol; if (!k) return; META.vol = META.vol || { master: 1, music: 1, sfx: 1 }; META.vol[k] = Math.max(0, Math.min(1, (+e.target.value || 0) / 100)); saveMeta(); shVol(); if (e.type === 'change' && k !== 'music') shSay('coin'); }

// ---------- 켜기 ----------
function shBoot() {
  const nj = $('nojs'); if (nj) nj.hidden = true;
  $('title').addEventListener('click', shClick); $('modal').addEventListener('click', shClick);
  $('modal').addEventListener('input', shInput); $('modal').addEventListener('change', shInput);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) shClose(); });
  shVol(); showTitle(); initCloud();
}
if (typeof window !== 'undefined') window.__shell = { get meta() { return META; }, get open() { return SH.open; }, title: () => showTitle(), start: run => shStart(run), saved: () => lairSaved(), codex: (tab, pick) => { SH.tab = tab || 'kin'; SH.pick = pick || null; shCodex(); }, help: page => { SH.page = page || 'board'; shHelp(); }, set: () => shSet(), last: () => shLast(), close: () => shClose(), sv: SAVE_V };
shBoot();
})();</script>
</body></html>
