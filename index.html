/* 배치 원칙: 어떤 화면도 스크롤 없이 한눈에 들어온다. 긴 내용은 아래로 늘이지 않고 탭으로 나눈다.
   PC: 위에 현황판 한 줄, 왼쪽에 지도와 할 일, 오른쪽에 고른 것의 패널.
   휴대폰: 현황판 두 줄, 지도, 할 일, 아래 단추 줄. 무언가를 고르면 패널이 지도를 덮고 올라온다. */
:root {
  color-scheme: dark;
  --ink: #14172a; --panel: #212640; --panel2: #2c3256; --line: #3f4674;
  --text: #ece6d6; --mute: #a2a8c6; --coin: #e8c030;
  --up: #ff7d76; --down: #5b9bff; --ok: #6fd08c; --warn: #ffb347;
  --fire: #e8552f; --water: #3fa7e0; --gold: #e8c030; --route: var(--coin);
  --display: "NestPix", "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  /* 글자 크기 단계. 픽셀 글꼴은 12의 배수라야 PC에서 또렷하다. 휴대폰은 화소가 촘촘해 16도 쓴다 */
  --d1: 12px; --d2: 24px; --d3: 36px; --d4: 48px;
  --t1: 12px; --t2: 14px; --t3: 16px;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --sab: env(safe-area-inset-bottom, 0px);
  /* 입체 틀: 바깥은 어둡게, 위·왼쪽은 밝게, 아래·오른쪽은 그늘지게. 번짐 없이 계단으로만 */
  --edge: #090a14; --hi: rgba(255, 255, 255, .09); --lo: rgba(0, 0, 0, .34);
  --bevel: inset 0 0 0 2px var(--edge), inset 2px 2px 0 2px var(--hi), inset -2px -2px 0 2px var(--lo);
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--ink) repeating-linear-gradient(0deg, rgba(255, 255, 255, .012) 0 2px, transparent 2px 4px); color: var(--text); font-family: var(--body); font-size: var(--t2); line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; line-break: strict; }
p, li, .small { text-wrap: pretty; }
body::before { content: ""; position: fixed; top: 0; right: 0; left: 0; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
/* 빠르게 두 번 누르면 브라우저가 화면을 확대하는 것을 막는다 */
html, body, #game, #game *, #title, #title *, #modal, #modal *, #scene, #scene * { touch-action: manipulation; }
#game, #title { -webkit-tap-highlight-color: transparent; }
#game { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
h1, h2, h3, .h3, .tab, .btn, .grade { font-family: var(--display); font-weight: 400; letter-spacing: 0; }
h2 { font-size: var(--d2); line-height: 1.2; margin: 0; text-wrap: balance; }
h3, .h3 { font-size: var(--d1); margin: 0; }
p { margin: 0; }
.mute { color: var(--mute); } .small { font-size: var(--t1); }
.up { color: var(--up); } .down { color: var(--down); } .coin { color: var(--coin); } .okc { color: var(--ok); } .warnc { color: var(--warn); }
.num { font-variant-numeric: tabular-nums; }
img.px, canvas.px { image-rendering: pixelated; display: block; }
.opts.one { grid-template-columns: minmax(0, 1fr); }
.gods { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; font-size: var(--t1); flex: none; } .gods > span { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; white-space: nowrap; overflow: hidden; }
.gpips { display: inline-flex; gap: 1px; vertical-align: middle; } .gpips i { width: 5px; height: 8px; background: var(--edge); box-shadow: inset 0 0 0 1px var(--line); } .gpips i:nth-child(4) { margin-left: 3px; } .gpips i.pos { background: var(--ok); } .gpips i.neg { background: var(--up); }
.slbox { display: inline-flex; align-items: flex-end; justify-content: center; flex: none; } .slbox img { flex: none; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
kbd { font-family: var(--body); font-size: var(--t1); border: 1px solid var(--line); padding: 0 5px; color: var(--mute); }
.clamp1, .clamp2, .clamp3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.clamp1 { -webkit-line-clamp: 1; } .clamp2 { -webkit-line-clamp: 2; } .clamp3 { -webkit-line-clamp: 3; }

/* 공통 부품 */
.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--edge); box-shadow: inset 0 0 0 1px var(--line), inset 0 3px 0 rgba(255, 255, 255, .10), inset 0 -4px 0 rgba(0, 0, 0, .30); text-shadow: 0 1px 0 rgba(0, 0, 0, .5); padding: 7px 12px; font-size: var(--d1); line-height: 1.35; cursor: pointer; }
.btn:hover { box-shadow: inset 0 0 0 1px var(--coin), inset 0 3px 0 rgba(255, 255, 255, .10), inset 0 -4px 0 rgba(0, 0, 0, .30); }
.btn:active:not([disabled]) { box-shadow: inset 0 0 0 1px var(--line), inset 0 4px 0 rgba(0, 0, 0, .34); transform: translateY(1px); }
.btn.pri, .btn.on { background: var(--coin); color: var(--ink); text-shadow: none; box-shadow: inset 0 0 0 1px #fff3a0, inset 0 3px 0 #fff3a0, inset 0 -5px 0 #a87e14; }
.btn.pri:active:not([disabled]) { box-shadow: inset 0 0 0 1px #a87e14, inset 0 4px 0 #a87e14; }
.btn.bad { border-color: var(--up); color: var(--up); }
.btn.sm { padding: 3px 8px; font-size: var(--d1); }
.btn.big { font-size: var(--d2); padding: 8px 20px; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn small { font-family: var(--body); font-size: var(--t1); opacity: .85; }
.btn.pri kbd, .btn.on kbd { color: var(--ink); border-color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row.nw { flex-wrap: nowrap; }
.end { justify-content: flex-end; }
.grow { flex: 1 1 0; min-width: 0; }
.card { background: var(--panel); box-shadow: var(--bevel); padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
.card.in { background: var(--panel2); }
.stack { display: flex; flex-direction: column; gap: 7px; }
.chip { display: inline-block; padding: 1px 7px; font-size: var(--t1); background: var(--panel2); border: 1px solid var(--line); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .22); color: var(--text); white-space: nowrap; }
.chip.on { background: var(--coin); color: var(--ink); border-color: var(--coin); }
.chip.good { border-color: var(--ok); color: var(--ok); } .chip.fake { border-color: var(--up); color: var(--up); }
button.chip { cursor: pointer; font-family: var(--body); padding: 4px 9px; font-size: var(--t1); }
.chip.todo { border-color: var(--coin); color: var(--coin); animation: blink 1s steps(2) 3; }
.bar { height: 8px; background: var(--edge); box-shadow: inset 0 0 0 1px var(--line); flex: 1 1 80px; min-width: 40px; display: block; }
.bar > i { display: block; height: 100%; background: var(--ok); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35), inset 0 -2px 0 rgba(0, 0, 0, .25); }
.stack > .bar { flex: 0 0 8px; width: 100%; }
.sec { font-family: var(--display); font-size: var(--d1); color: var(--coin); display: flex; gap: 8px; align-items: baseline; margin-top: 2px; }
.sec small { font-family: var(--body); font-size: var(--t1); color: var(--mute); }

/* 탭: 긴 내용을 아래로 늘이지 않고 나눈다 */
.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); flex: none; }
.tabs.wrap { flex-wrap: wrap; border-bottom: 0; gap: 4px; }

/* 게임 화면 */
#game { height: 100%; height: 100dvh; display: flex; flex-direction: column; max-width: 1560px; margin: 0 auto; overflow: hidden; position: relative; }

.pip.off { background: var(--panel2); box-shadow: inset 0 0 0 1px var(--edge); }
img.ic { display: inline-block; vertical-align: -4px; margin-right: 4px; }

.stat { background: var(--panel); border: 0; color: inherit; font: inherit; padding: 3px 9px 2px; cursor: help; box-shadow: var(--bevel); }

#toast { position: fixed; left: 30%; transform: translateX(-50%); top: calc(var(--hud-h, 56px) + 16px + env(safe-area-inset-top, 0px)); z-index: 40; max-width: min(50vw, 560px); pointer-events: none;
  background: var(--panel2); border: 1px solid var(--coin); padding: 7px 14px; text-align: center; color: var(--text); font-size: var(--t2); box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
#toast.err { color: var(--up); border-color: var(--up); }

#main { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(360px, 1fr); gap: 16px; padding-block: 10px; }

#stagewrap { position: relative; flex: none; }
#stage { display: block; width: 100%; height: auto; aspect-ratio: 960 / 550; max-height: calc(100dvh - 236px); background: var(--edge); border: 2px solid var(--edge); outline: 2px solid var(--line); outline-offset: -4px; cursor: pointer; }
#viewsw { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; }
#corebtn { margin-right: 8px; border-color: var(--coin); color: var(--coin); }

#foot { flex: none; display: flex; flex-direction: column; gap: 4px; }

/* 패널 */
.ph { display: flex; align-items: center; gap: 8px; flex: none; min-height: 34px; }

.unit { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--text); font: inherit; font-size: var(--t1); padding: 2px 8px 2px 2px; cursor: pointer; min-width: 0; }

.xp { height: 4px; background: var(--panel2); } .xp > i { display: block; height: 100%; background: var(--down); }

/* 창과 대사 */

  padding: calc(14px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) calc(14px + var(--sab)) max(14px, env(safe-area-inset-left, 0px)); }
.sheet { --sx: 16px; --sy: 14px; background: var(--panel); border: 2px solid var(--coin); box-shadow: inset 0 0 0 2px var(--edge), 0 8px 0 rgba(0, 0, 0, .4); max-width: 600px; width: 100%; max-height: 100%; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; overflow: hidden; }

.mfoot { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
.msum { flex: 1 1 0; min-width: 0; }
#night.asking #nlog, #night.asking #nparty { display: none; }
.ledger { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 1px 12px; }
.ledger .tot { border-top: 1px solid var(--line); padding-top: 3px; font-family: var(--display); }
.ledger .tot.l { grid-column: 1 / 4; }
.pick3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pcard { align-items: center; text-align: center; gap: 3px; }
.pcard.rare { outline: 2px solid var(--coin); }
.pick6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.pick5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pick6 .btn, .pick5 .btn { font-family: var(--body); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-width: 0; }
.pick6 .btn.on, .pick5 .btn.on { background: var(--panel2); color: var(--text); outline: 2px solid var(--coin); }
.pick6 .btn b, .pick5 .btn b { font-family: var(--display); font-weight: 400; font-size: var(--d1); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.caprow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto auto; gap: 5px; align-items: center; background: var(--panel2); padding: 3px 6px 3px 3px; }
.caprow .btn { padding: 4px 7px; font-size: var(--d1); white-space: nowrap; }
.grade { font-size: 96px; line-height: 1; color: var(--coin); text-shadow: 5px 5px 0 #7a2a1c; text-align: center; }
.codex { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.codex.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .codex.c4 .node { padding: 8px 2px 6px; justify-content: flex-end; }
.codex .node { background: var(--panel2); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; font-size: var(--t1); }
.codex .node.unk img { filter: brightness(0); opacity: .5; }
#scene { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; background: rgba(8, 9, 20, .72); display: flex; align-items: flex-end; justify-content: center; cursor: pointer;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(32px + var(--sab)) max(16px, env(safe-area-inset-left, 0px)); }
#scene .box { background: var(--panel); border: 2px solid var(--coin); width: min(100%, 860px); padding: 16px 18px; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start; min-height: 150px; }
#scene .who { font-family: var(--display); font-size: var(--d2); color: var(--coin); }
#scene .txt { font-size: var(--t3); line-height: 1.6; min-height: 3.2em; }

@keyframes tick { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.tick { animation: tick .25s both; }

/* 기록과 명부 */
.board { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 3px 10px; align-items: baseline; }

/* 결말 그림과 글 */

#rotate { display: none; }
@media (hover: none) { kbd { display: none; } .btn:hover { border-color: var(--line); } .btn.pri:hover, .btn.on:hover { border-color: var(--coin); } }
@media (min-width: 761px) { .only-m { display: none !important; } }

/* 휴대폰 세로 화면 */

    padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); }

  #left { flex: 1 1 0; gap: 5px; }
  /* 지도는 남는 높이를 다 쓴다. 아래 줄들의 높이가 고정이라 지도 크기는 변하지 않는다 */

  .btn { min-height: 40px; }

  .tab { padding: 9px 2px; }

  #modal { padding: calc(8px + env(safe-area-inset-top, 0px)) 8px calc(8px + var(--sab)); }
