/* 옛 것의 둥지 — 굴 (den). 이름은 모두 dn- 로 시작한다. 352×580 을 먼저 맞춘다. */
:root {
  --dn-bg: #170e22; --dn-bg2: #22142f; --dn-card: #2d1b3d; --dn-card2: #3a2450; --dn-line: #4d3366;
  --dn-ink: #f3e9f7; --dn-dim: #b9a6c8; --dn-faint: #8a76a0; --dn-gold: #f2c25a; --dn-teal: #5fd6c2; --dn-pink: #f08ab4; --dn-red: #ef6a6a;
  --dn-hunger: #e0524f; --dn-abyss: #4aa3df; --dn-brood: #8fd14f; --dn-dusk: #f0a04b; --dn-nebula: #b08cf0;
  --dn-vh: 100vh;
}
html, body { background: var(--dn-bg); color: var(--dn-ink); margin: 0; height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body, button, input { font-family: "Nest Sans", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }
.dn-px { image-rendering: pixelated; image-rendering: crisp-edges; }
img.dn-ic { width: 16px; height: 16px; vertical-align: -3px; image-rendering: pixelated; }

/* ---------- 첫 화면 ---------- */
#dn-title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; background: radial-gradient(ellipse at 50% 30%, #2f1c44 0%, var(--dn-bg) 70%); }
#dn-tcv { width: min(92vw, 384px); aspect-ratio: 2 / 1; image-rendering: pixelated; border-radius: 10px; background: #1f1230; }
#dn-title h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .02em; text-align: center; }
#dn-title h1 small { display: block; font-size: 14px; font-weight: 600; color: var(--dn-dim); margin-top: 4px; }
#dn-menu { display: flex; flex-direction: column; gap: 10px; width: min(84vw, 300px); }
#dn-best { font-size: 14px; color: var(--dn-dim); text-align: center; min-height: 1.3em; margin: 0; }
#nojs { font-size: 13px; color: var(--dn-dim); max-width: 320px; text-align: center; }
.dn-btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 12px 10px; background: var(--dn-card2); color: var(--dn-ink); font-size: 17px; font-weight: 700; box-shadow: inset 0 -3px 0 rgba(0,0,0,.3); }
.dn-btn.pri { background: linear-gradient(#8a4fc0, #6b3a9c); }
.dn-btn:disabled { opacity: .45; }
.dn-btn.sm { font-size: 15px; padding: 9px 8px; }

/* ---------- 본 화면 ---------- */
#dn { position: fixed; inset: 0; display: flex; flex-direction: column; height: var(--dn-vh); max-width: 520px; margin: 0 auto; background: var(--dn-bg); }
#dn-top { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; padding: 4px 6px; background: var(--dn-bg2); border-bottom: 1px solid var(--dn-line); min-height: 34px; }
.dn-stat { display: inline-flex; align-items: center; gap: 3px; font-size: 15px; font-weight: 700; padding: 0 4px; white-space: nowrap; }
.dn-stat img { width: 16px; height: 16px; image-rendering: pixelated; }
.dn-stat.night { color: var(--dn-dim); font-weight: 600; }
#dn-top .dn-sp { flex: 1; }
#dn-lamp { width: 24px; height: 24px; image-rendering: pixelated; }
#dn-lamp.on { animation: dn-glow 1.4s ease-in-out infinite; }
@keyframes dn-glow { 50% { filter: drop-shadow(0 0 5px #ffcf5a); } }
#dn-menub { border: 0; background: transparent; font-size: 15px; font-weight: 700; padding: 4px 6px; color: var(--dn-dim); }
#dn-cavew { flex: 1 1 auto; position: relative; min-height: 220px; overflow: hidden; }
#dn-cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }
#dn-capl { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 3px 8px; font-size: 14px; font-weight: 700; background: #1b1028; border-top: 1px solid var(--dn-line); }
#dn-capl span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
#dn-capl img { width: 14px; height: 14px; image-rendering: pixelated; }
#dn-capl .short { color: var(--dn-red); animation: dn-blink 1s steps(2) infinite; }
@keyframes dn-blink { 50% { opacity: .35; } }
#dn-capl .lux { color: var(--dn-gold); letter-spacing: -.02em; }
#dn-note { flex: 0 0 auto; min-height: 38px; padding: 4px 10px; font-size: 14px; line-height: 1.35; color: var(--dn-dim); display: flex; align-items: center; }
#dn-row { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 2px 8px; min-height: 40px; }
.dn-orb { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #241634; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.dn-orb img { width: 28px; height: 28px; image-rendering: pixelated; }
.dn-orb:disabled { opacity: 1; cursor: default; }
.dn-orb.live { box-shadow: 0 0 0 2px var(--dn-gold); }
#dn-row .dn-sp { flex: 1; }
.dn-small { border: 0; border-radius: 10px; padding: 7px 10px; background: var(--dn-card2); font-size: 15px; font-weight: 700; white-space: nowrap; }
.dn-small.hot { background: #7b3c66; }
#dn-cmds { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px 8px 8px; }
#dn-cmds button { border: 0; border-radius: 12px; min-height: 48px; padding: 6px 2px; background: linear-gradient(#4a2d66, #3a2250); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 4px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
#dn-cmds button img { width: 20px; height: 20px; image-rendering: pixelated; }
#dn-cmds button:disabled { opacity: .4; }
#dn-raidc { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px 8px 8px; }
#dn-raidc button { border: 0; border-radius: 12px; min-height: 48px; background: #33213f; font-size: 16px; font-weight: 700; }
#dn-ask { flex: 0 0 auto; padding: 6px 8px 8px; background: #2b1530; border-top: 2px solid var(--dn-red); }
#dn-ask p { margin: 0 0 6px; font-size: 15px; line-height: 1.35; }
#dn-ask .dn-askb { display: flex; gap: 6px; }
#dn-ask .dn-askb button { flex: 1; border: 0; border-radius: 10px; min-height: 44px; font-size: 16px; font-weight: 700; background: var(--dn-card2); }
#dn-ask .dn-askb button.pri { background: #8a3f5f; }

/* ---------- 창 (아래에서 올라온다) ---------- */
#dn-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; pointer-events: none; }
.dn-sbox { pointer-events: auto; width: 100%; max-width: 520px; max-height: calc(var(--dn-vh) * 0.66); display: flex; flex-direction: column; background: var(--dn-bg2); border-top: 2px solid var(--dn-line); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.5); animation: dn-up .18s ease-out; }
.dn-sbox.tall { max-height: calc(var(--dn-vh) * 0.9); }
@keyframes dn-up { from { transform: translateY(30px); opacity: .4; } }
.dn-shead { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; border-bottom: 1px solid var(--dn-line); }
.dn-shead h2 { margin: 0; flex: 1; font-size: 17px; font-weight: 800; min-width: 0; }
.dn-shead h2 small { font-size: 13px; color: var(--dn-dim); font-weight: 600; margin-left: 4px; }
.dn-x { border: 0; border-radius: 10px; padding: 7px 12px; background: var(--dn-card2); font-size: 15px; font-weight: 700; white-space: nowrap; }
.dn-sbody { flex: 1 1 auto; overflow-y: auto; padding: 8px 10px 12px; -webkit-overflow-scrolling: touch; }
.dn-sfoot { flex: 0 0 auto; display: flex; gap: 6px; padding: 6px 10px 10px; border-top: 1px solid var(--dn-line); }
.dn-sfoot button { flex: 1; }
.dn-desc { margin: 0 0 8px; }
.dn-desc b { display: block; font-size: 15px; }
.dn-desc span { display: block; padding-left: 12px; font-size: 14px; color: var(--dn-dim); line-height: 1.4; margin-top: 2px; }
.dn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.dn-card { position: relative; border: 2px solid transparent; border-radius: 12px; background: var(--dn-card); padding: 5px 6px 4px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dn-card.cur { border-color: var(--dn-teal); }
.dn-card.lock { opacity: .5; }
.dn-card:disabled { opacity: .5; }
.dn-card .nm { font-size: 15px; font-weight: 700; line-height: 1.25; }
.dn-card .bl { display: flex; flex-wrap: wrap; gap: 1px; min-height: 20px; align-items: center; }
.dn-card .bl img { width: 20px; height: 20px; image-rendering: pixelated; }
.dn-card .ct { font-size: 14px; font-weight: 700; color: var(--dn-gold); display: inline-flex; align-items: center; gap: 2px; }
.dn-card .ct.no { color: var(--dn-faint); }
.dn-card .sub { font-size: 13px; color: var(--dn-dim); line-height: 1.3; }
.dn-kc { flex-direction: row; gap: 8px; align-items: center; margin-bottom: 6px; width: 100%; }
.dn-kc .art { flex: 0 0 auto; width: 48px; height: 48px; image-rendering: pixelated; background: #1f1230; border-radius: 10px; }

.dn-led td { padding: 3px 4px; border-bottom: 1px solid #3a2650; }
.dn-led td:last-child { text-align: right; font-weight: 700; white-space: nowrap; }
.dn-led tr.sum td { border-bottom: 0; font-weight: 800; color: var(--dn-gold); }
.dn-line { font-size: 15px; line-height: 1.45; margin: 4px 0 8px; }
.dn-log { font-size: 13px; line-height: 1.45; color: var(--dn-dim); margin: 0; padding-left: 4px; list-style: none; }
.dn-log li { padding: 1px 0; border-bottom: 1px dashed #33223f; overflow-wrap: anywhere; }
.dn-up { display: flex; gap: 8px; align-items: center; font-size: 14px; margin: 4px 0; }
.dn-up img { width: 32px; height: 32px; image-rendering: pixelated; }
.dn-gods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; }
.dn-god { border: 2px solid transparent; border-radius: 12px; background: var(--dn-card); padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; min-width: 0; }
.dn-god img { width: 28px; height: 28px; image-rendering: pixelated; }
.dn-god.cur { border-color: var(--dn-gold); }
.dn-god .dots { font-size: 11px; letter-spacing: 1px; color: var(--dn-dim); }
.dn-strk { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.dn-place { width: 192px; height: 128px; image-rendering: pixelated; border-radius: 10px; background: #0f0a1a; }
.dn-place.shake { animation: dn-shake .12s linear infinite; }
@keyframes dn-shake { 25% { transform: translate(-1px, 1px); } 75% { transform: translate(1px, -1px); } }
.dn-bar { width: 100%; max-width: 320px; display: grid; gap: 2px; }
.dn-bar i { display: block; height: 16px; border-radius: 3px; background: #3a2650; }
.dn-bar i.on { background: var(--dn-teal); }
.dn-bar i.on.near { background: var(--dn-gold); }
.dn-bar i.over { background: var(--dn-red); }
.dn-dice { display: flex; gap: 8px; min-height: 52px; align-items: center; }
.dn-die { position: relative; width: 48px; height: 48px; }
.dn-die img { width: 48px; height: 48px; image-rendering: pixelated; }
.dn-die b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: #1a1020; padding-top: 4px; }
.dn-die.slot { border: 2px dashed #4d3366; border-radius: 10px; }
.dn-die.roll { animation: dn-roll .4s ease-out; }
@keyframes dn-roll { 0% { transform: translateY(-14px) rotate(-90deg); } 60% { transform: translateY(3px) rotate(15deg); } 100% { transform: none; } }
.dn-die .gsig { position: absolute; right: -10px; top: -10px; width: 22px; height: 22px; }
.dn-sum { font-size: 18px; font-weight: 800; }
.dn-res { font-size: 16px; font-weight: 700; text-align: center; line-height: 1.4; }
.dn-res small { display: block; font-size: 14px; color: var(--dn-dim); font-weight: 600; }
.dn-plist button { width: 100%; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.dn-plist img { width: 72px; height: 48px; image-rendering: pixelated; border-radius: 6px; }
.dn-input { width: 100%; font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid var(--dn-line); background: #120a1c; color: var(--dn-ink); }
.dn-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 14px; margin: 6px 0; }
.dn-stats span { display: flex; align-items: center; gap: 4px; }

/* ---------- 알림 ---------- */
#dn-toast { position: fixed; left: 50%; top: 42px; z-index: 41; transform: translateX(-50%); z-index: 40; max-width: calc(100vw - 24px); background: #3a2450; color: var(--dn-ink); border-radius: 10px; padding: 8px 12px; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.5); pointer-events: none; }
#dn-flash { position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0; transition: opacity .25s; }

/* ---------- 길잡이 ---------- */
#dn-spot { position: fixed; z-index: 30; border: 3px solid var(--dn-gold); border-radius: 12px; pointer-events: none; box-shadow: 0 0 0 2px rgba(0,0,0,.4), 0 0 14px rgba(242,194,90,.7); animation: dn-spot 1.2s ease-in-out infinite; }

#dn-tip { position: fixed; z-index: 31; background: #fff6df; color: #2a1838; border-radius: 12px; padding: 8px 10px 8px 12px; box-shadow: 0 6px 18px rgba(0,0,0,.5); display: flex; align-items: flex-start; gap: 8px; }
#dn-tip p { margin: 0; flex: 1; font-size: 15px; line-height: 1.4; }
#dn-tip button { flex: 0 0 auto; border: 0; border-radius: 8px; background: #2a1838; color: #fff6df; font-size: 14px; font-weight: 700; padding: 6px 9px; }

.dn-intro p { margin: 0; font-size: 17px; line-height: 1.45; font-weight: 600; }
.dn-intro .pg { font-size: 13px; color: var(--dn-dim); }

#dn-end { position: fixed; inset: 0; z-index: 25; overflow-y: auto; background: radial-gradient(ellipse at 50% 20%, #3a2450, var(--dn-bg) 70%); padding: 16px 14px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
